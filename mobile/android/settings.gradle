pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }
    settings.ext.flutterSdkPath = flutterSdkPath()

    includeBuild("${settings.ext.flutterSdkPath}/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    // The loader reads .flutter-plugins-dependencies (written by `flutter pub get`)
    // and includes each plugin's android project. The gradle plugin itself comes
    // from the includeBuild above — it must NOT be versioned here.
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "8.11.1" apply false
    id "org.jetbrains.kotlin.android" version "2.2.20" apply false
    // Applied per-app only when google-services.json exists (see app/build.gradle)
    id "com.google.gms.google-services" version "4.4.2" apply false
}

include ":app"
