name: mausam_nextgen
description: "Mausam Next-Gen — SIH26076 offline-first, SDUI-driven weather client."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

  # State & reactivity
  rxdart: ^0.28.0

  # Offline-first storage (hive_ce = community-maintained Hive fork; core `hive` is discontinued)
  hive_ce: ^2.10.0
  hive_ce_flutter: ^2.2.0

  # Networking
  http: ^1.2.2
  connectivity_plus: ^6.1.0

  # Storage security (favorites AES key) + hashing (device hash)
  flutter_secure_storage: ^9.2.4
  crypto: ^3.0.6

  # Maps (official plugin — not the third-party `flutter_map_libre` fork)
  maplibre_gl: ^0.20.0

  # Vernacular audio ("Suno Mausam")
  flutter_tts: ^4.1.0
  just_audio: ^0.10.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/gazetteer/
    - assets/fallback/
    - assets/checklists/
